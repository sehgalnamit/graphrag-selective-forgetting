name: graphrag-selective-forgetting

services:
  neo4j:
    image: neo4j:5.26-community
    container_name: grsf-neo4j
    environment:
      NEO4J_AUTH: neo4j/please-change-me
      NEO4J_server_memory_pagecache_size: 256M
      NEO4J_server_memory_heap_initial__size: 256M
      NEO4J_server_memory_heap_max__size: 512M
      NEO4J_PLUGINS: '[]'
    ports:
      - "7474:7474"   # browser UI
      - "7687:7687"   # bolt
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: grsf-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    # Optional job queue. Not required by the current demo pipeline (the
    # decay-engine worker uses an in-process scheduler), reserved for a
    # future async task-queue (e.g. Celery/RQ ingestion jobs) if ingestion
    # volume outgrows synchronous request handling.
    image: redis:7-alpine
    container_name: grsf-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: grsf-app
    environment:
      USE_FAKE_STORES: "false"
      EMBEDDER_BACKEND: "auto"
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_USER: "neo4j"
      NEO4J_PASSWORD: "please-change-me"
      QDRANT_URL: "http://qdrant:6333"
      AUDIT_DB_PATH: "/data/audit_log.sqlite3"
      DECAY_INTERVAL_SECONDS: "300"
      PRUNE_THRESHOLD: "0.15"
      PRUNE_GRACE_PERIOD_HOURS: "24"
    ports:
      - "8000:8000"
    volumes:
      - audit_data:/data
    depends_on:
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  decay-engine:
    build:
      context: .
      dockerfile: Dockerfile.decay
    container_name: grsf-decay-engine
    environment:
      USE_FAKE_STORES: "false"
      EMBEDDER_BACKEND: "auto"
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_USER: "neo4j"
      NEO4J_PASSWORD: "please-change-me"
      QDRANT_URL: "http://qdrant:6333"
      AUDIT_DB_PATH: "/data/audit_log.sqlite3"
      DECAY_INTERVAL_SECONDS: "300"
      PRUNE_THRESHOLD: "0.15"
      PRUNE_GRACE_PERIOD_HOURS: "24"
      DECAY_TENANT_IDS: "demo"
    volumes:
      - audit_data:/data
    depends_on:
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_healthy

volumes:
  neo4j_data:
  neo4j_logs:
  qdrant_storage:
  audit_data:
